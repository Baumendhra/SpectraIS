apiVersion: apps/v1
kind: Deployment
metadata:
  name: spectrais-backend-deployment
  namespace: spectrais-prod
  labels:
    app.kubernetes.io/name: spectrais-backend
    app.kubernetes.io/part-of: spectrais-gov-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spectrais-backend
  template:
    metadata:
      labels:
        app: spectrais-backend
    spec:
      containers:
      - name: api-server
        image: asia-south1-docker.pkg.dev/spectrais-gov-prod/backend/api:v2.0.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: spectrais-config
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spectrais-backend-service
  namespace: spectrais-prod
spec:
  type: ClusterIP
  selector:
    app: spectrais-backend
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spectrais-backend-hpa
  namespace: spectrais-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spectrais-backend-deployment
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spectrais-config
  namespace: spectrais-prod
data:
  PROJECT_NAME: "SpectraIS Government Procurement Intelligence Platform"
  QDRANT_HOST: "qdrant.spectrais-prod.svc.cluster.local"
  QDRANT_PORT: "6333"
  VECTOR_SIZE: "768"
  MAX_CONCURRENT_USERS: "10000"
